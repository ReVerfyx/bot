name: ✅ Проверка

on:
  push:
    branches-ignore: []
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --no-input -r requirements.txt
      - name: Нет секретов в коде
        run: python -m tests.check_secrets
      - name: Синтаксис и импорты
        run: |
          python -m compileall -q bot
          BOT_TOKEN=1:test python -c "import bot.main; print('импорты ок')"
      - name: Конфиг и тексты
        run: BOT_TOKEN=1:test python -m tests.check_config
      - name: Кнопки и хендлеры
        run: BOT_TOKEN=1:test python -m tests.check_callbacks
      - name: Логика заказов
        run: BOT_TOKEN=1:test python -m tests.smoke
