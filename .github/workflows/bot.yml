name: 🤖 Telegram bot

# Бот живёт внутри job'а ~5ч45м, затем гасится сам и стартует заново:
#  • cron каждые 6 часов — основной цикл (concurrency отменяет прошлый запуск);
#  • workflow_dispatch в конце job'а — мгновенный рестарт, если cron задержался;
#  • push в основную ветку — деплой новой версии без ожидания.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "bot/**"
      - "config.yml"
      - "requirements.txt"
      - ".github/workflows/bot.yml"

# Одновременно живёт ровно один экземпляр: новый запуск гасит предыдущий,
# иначе Telegram отдаст 409 Conflict на long polling.
concurrency:
  group: telegram-bot
  cancel-in-progress: true

permissions:
  contents: read
  issues: write        # хранилище заказов на GitHub Issues
  actions: write       # самоперезапуск воркфлоу

jobs:
  bot:
    name: Смена бота
    runs-on: ubuntu-latest
    timeout-minutes: 355          # 5ч55м — с запасом к RUN_DURATION_SECONDS

    # secrets нельзя читать в `if:`, поэтому пробрасываем PAT через env
    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install --no-input -r requirements.txt

      - name: Проверить конфиг
        run: python -c "import yaml,sys; yaml.safe_load(open('config.yml',encoding='utf-8')); print('config.yml ок')"

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CRYPTOBOT_TOKEN: ${{ secrets.CRYPTOBOT_TOKEN }}
          GH_STORE_TOKEN: ${{ secrets.GH_STORE_TOKEN || github.token }}
          GH_STORE_REPO: ${{ github.repository }}
          RUN_DURATION_SECONDS: "20700"      # 5ч45м работы, потом штатная остановка
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: "1"
        run: python -m bot

      # Не ждём следующий cron: сразу поднимаем новую смену.
      # Нужен PAT (secrets.GH_PAT) — запуск через github.token новый workflow не триггерит.
      - name: Поднять следующую смену
        if: ${{ always() && env.GH_PAT != '' }}
        run: |
          echo "Перезапускаю воркфлоу на ветке ${GITHUB_REF_NAME}"
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            --retry 3 --retry-delay 5 --fail-with-body
