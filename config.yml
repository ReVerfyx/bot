    $e_crypto <b>Оплата через CryptoBot</b>

    Заказ <b>#$order_id</b> · сумма <b>$amount</b>

    Нажми «Оплатить», подтверди перевод, затем вернись сюда
    и нажми «Проверить оплату».

  pay_choose_wallet: "$e_wallet Выбери монету и сеть для перевода:"

  pay_manual: |
    $e_wallet <b>$wallet_title</b>

    Заказ <b>#$order_id</b>
    Сумма: <b>$amount</b>  ≈ <b>$crypto_amount</b>

    Адрес для перевода:
    <code>$address</code>

    <i>$note</i>

    После перевода нажми «Я оплатил» и пришли хеш транзакции или скриншот.

  pay_ask_proof: |
    $e_photo Пришли <b>хеш транзакции</b> или <b>скриншот</b> перевода
