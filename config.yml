    Загляни в каталог — там 3 / 7 / 30 дней на самокаты $e_scooter

  orders_header: "$e_orders <b>Твои заказы</b>"

  order_card: |
    $e_orders <b>Заказ #$order_id</b>

    $title
    ━━━━━━━━━━━━━━━━━━━━
    Статус: <b>$status</b>
    Сумма: <b>$amount</b>
    Создан: <code>$created</code>
    $extra

  support_intro: |
    $e_support <b>Поддержка</b>

    Опиши проблему одним сообщением — оператор ответит прямо здесь.
    Если вопрос по заказу, укажи его номер.

    Прямой контакт: $support

  support_ask: "$e_support Напиши сообщение для оператора:"
  support_created: |
    $e_check Обращение <b>#$ticket_id</b> создано.

    Ответ придёт сюда. Среднее время ответа — до 1 часа.

  support_reply: |
    $e_support <b>Ответ оператора · обращение #$ticket_id</b>

    $text

  refund_intro: "$policy"
  refund_no_orders: |
    $e_info Нет заказов, по которым можно оформить возврат.

    Возврат доступен по оплаченным заказам в течение $window ч.

  refund_pick: "$e_refund Выбери заказ для возврата:"
  refund_ask_reason: "$e_refund Опиши причину возврата по заказу <b>#$order_id</b>:"
  refund_created: |
    $e_check Заявка на возврат по заказу <b>#$order_id</b> принята.

    Оператор рассмотрит её в течение 24 часов и напишет сюда.

  refund_approved: |
    $e_check <b>Возврат по заказу #$order_id одобрен!</b>

    Пришли <b>адрес криптокошелька</b> для возврата средств
    (тот же актив и сеть, что и при оплате).

  refund_wallet_saved: "$e_check Кошелёк принят. Отправим средства в ближайшее время."
  refund_done: |
    $e_success <b>Возврат по заказу #$order_id отправлен!</b>

    Средства поступят после подтверждения сети.

  refund_declined: |
    $e_error <b>Возврат по заказу #$order_id отклонён</b>

    Причина: $reason

  banned: "$e_cross Доступ к боту ограничен. По вопросам — $support"
