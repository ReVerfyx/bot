  pay_check_pending: "$e_clock Платёж по счёту ещё не поступил. Попробуй через минуту."
  pay_check_paid: "$e_check Платёж получен! Заказ <b>#$order_id</b> ушёл на проверку оператору."

  order_confirmed: |
    $e_success <b>Оплата по заказу #$order_id подтверждена!</b>

    $title

    Остался последний шаг — нажми кнопку ниже и пришли данные,
    чтобы оператор запустил активацию.

  activation_menu: |
    $e_scooter <b>Активация · заказ #$order_id</b>

    Пришли <b>номер самоката</b> или <b>скриншот</b> из приложения.
