# ═══════════════════════════════════════════════════════════════════════════
#  КОНФИГ БОТА. Всё, что видит покупатель — правится здесь, код трогать не надо.
#  Плейсхолдеры в текстах пишутся через $имя  (например $order_id, $amount).
# ═══════════════════════════════════════════════════════════════════════════

brand:
  name: "Yandex Go Shop"
  currency: "₽"
  currency_code: "RUB"        # код фиата для счетов CryptoBot
  # Публичный контакт поддержки. Оставь ПУСТЫМ, если не хочешь светить личный
  # аккаунт — бот будет отправлять клиентов в раздел «Поддержка» внутри бота.
  support_username: ""
  support_fallback: "через раздел 💬 Поддержка в этом боте"
  channel_url: "https://t.me/your_channel"
  reviews_url: "https://t.me/your_reviews"
  timezone: "Europe/Moscow"

# ── Красота: стикеры и эмодзи ────────────────────────────────────────────────
# sticker file_id получить: переслать стикер боту @RawDataBot → sticker.file_id
# custom_emoji_id (премиум-эмодзи) — работает только в ТЕКСТЕ сообщений,
# в кнопках Telegram премиум-эмодзи не поддерживает, там показывается обычное.
decor:
  stickers:
    welcome: ""        # CAACAgIAAxkBAA...
    order: ""
    paid: ""
    success: ""
    refund: ""
    error: ""
  emoji:
    scooter:   "🛴"
    bag:       "🛍"
    split:     "🧩"
    orders:    "🧾"
    support:   "💬"
    refund:    "↩️"
    info:      "ℹ️"
    admin:     "⚙️"
    pay:       "💳"
    crypto:    "🪙"
    wallet:    "👛"
    check:     "✅"
    cross:     "❌"
    clock:     "🕐"
    fire:      "🔥"
    star:      "⭐️"
    box:       "📦"
    truck:     "🚚"
    pin:       "📍"
    link:      "🔗"
    photo:     "🖼"
    back:      "◀️"
    home:      "🏠"
  # Премиум custom emoji: ключ такой же, как выше. Пусто = обычное эмодзи.
  custom_emoji:
    scooter:   ""      # 5449559196682753440
    bag:       ""
    pay:       ""
    check:     ""
    star:      ""

# ── Доступы ─────────────────────────────────────────────────────────────────
# ⚠️ ID админа СЮДА НЕ ВПИСЫВАЙ — этот файл лежит в git и виден всем, у кого
#    есть доступ к репозиторию. Админы задаются только секретом ADMIN_IDS
#    в настройках репозитория (Settings → Secrets and variables → Actions).
access:
  admins: []           # оставь пустым, используй секрет ADMIN_IDS
  admin_chat_id: 0     # оставь 0, используй секрет ADMIN_CHAT_ID
  maintenance: false   # true = бот отвечает только админам
  # Режим невидимого админа: у клиентов нет кнопки админки и никаких намёков
  # на её существование. Вход — команда /admin или кодовое слово ADMIN_SECRET.
  stealth: true

# ═══════════════════════════════════════════════════════════════════════════
#  1. САМОКАТЫ ЯНДЕКС GO
# ═══════════════════════════════════════════════════════════════════════════
scooters:
  enabled: true
  title: "Аренда Яндекс Go"
  items:
    - id: sc3
      emoji: "🛴"
      badge: "СТАРТ"
      title: "Подписка на 3 дня"
      price: 2000                # тестовая цена, меняй
      duration_days: 3
      sku: "sc3"                 # ключ склада промокодов (можно оставить, склад опционален)
      description: |
        • Безлимитные поездки 3 дня
        • Активация в течение 15 минут после подтверждения
        • Работает во всех городах присутствия сервиса
      # ↓ ЭТОТ ТЕКСТ придёт клиенту после того, как он пришлёт скрин/номер самоката
      instructions: |
        🛴 <b>Самокат активируется.</b>

        Напиши сюда свой текст инструкции для клиента.
        Например: «Разблокируй самокат в приложении в течение 5 минут.»

    - id: sc7
      emoji: "🛴"
      badge: "ХИТ"
      title: "Подписка на 7 дней"
      price: 2000
      duration_days: 7
      sku: "sc7"
      description: |
        • Безлимитные поездки 7 дней
        • Приоритетная поддержка
        • Активация в течение 15 минут
      instructions: |
        🛴 <b>Самокат активируется.</b>

        Текст инструкции для 7-дневного тарифа — впиши свой.

    - id: sc30
      emoji: "🛴"
      badge: "ВЫГОДНО"
      title: "Подписка на 30 дней"
      price: 2000
      duration_days: 30
      sku: "sc30"
      description: |
        • Безлимитные поездки 30 дней
        • Приоритетная поддержка 24/7
        • Замена при любой проблеме
      instructions: |
        🛴 <b>Самокат активируется.</b>

        Текст инструкции для 30-дневного тарифа — впиши свой.

# ═══════════════════════════════════════════════════════════════════════════
#  2. ТОВАРЫ С ЯНДЕКСА — фиксированный каталог (необязательно)
# ═══════════════════════════════════════════════════════════════════════════
goods:
  enabled: true
  title: "Товары с Яндекса"
  items: []
  # Пример:
  # - id: g1
  #   emoji: "🎧"
  #   title: "Наушники XYZ"
  #   price: 2000
  #   sku: ""
  #   description: "Описание"
  #   instructions: "Что прислать клиенту после подтверждения"

# ═══════════════════════════════════════════════════════════════════════════
#  3. СПЛИТ — клиент кидает ссылку на товар, бот считает комиссию
# ═══════════════════════════════════════════════════════════════════════════
split:
  enabled: true
  title: "Выкуп по Сплиту"
  min_price: 1000
  max_price: 150000              # выше — отказ
  fetch_timeout: 12
  allowed_domains:
    - market.yandex.ru
    - market.yandex.com
    - lavka.yandex.ru
    - eda.yandex.ru
    - ya.cc
    - yandex.ru
    - yandex.eu
  # Комиссия сервиса по стоимости товара. Клиент платит ТОЛЬКО комиссию.
  tiers:
    - up_to: 60000
      fee: 2000
    - up_to: 150000
      fee: 5000
  delivery:
    - id: pickup
      emoji: "📦"
      title: "Пункт выдачи"
      ask: "Укажи адрес пункта выдачи (город, улица, номер ПВЗ):"
    - id: courier
      emoji: "🚚"
      title: "Курьером"
      ask: "Укажи адрес доставки и удобное время (город, улица, дом, кв., время):"
  # Текст, который придёт клиенту после отправки скрина/данных по сплит-заказу
  instructions: |
    🧩 <b>Заявка передана оператору.</b>

    Впиши сюда свой текст: что происходит дальше, сроки выкупа и доставки.

# ═══════════════════════════════════════════════════════════════════════════
#  4. ОПЛАТА
# ═══════════════════════════════════════════════════════════════════════════
payment:
  order_ttl_minutes: 120         # через сколько неоплаченный заказ протухает
  manual_rate_fallback: 95.0     # курс ₽ за 1 USDT, если API курса недоступен
  cryptobot:
    enabled: true
    asset: "USDT"                # актив для оплаты
    invoice_in_fiat: true        # счёт выставляется в ₽, платится криптой
    expires_in: 3600
  manual:
    enabled: true
    require_proof: true          # требовать хеш транзакции / скриншот
    wallets:
      - title: "USDT · TRC-20"
        asset: "USDT"
        address: "TXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
        note: "Сеть Tron (TRC-20). Комиссию сети оплачивает отправитель."
      - title: "USDT · TON"
        asset: "USDT"
        address: "UQXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
        note: "Сеть TON. Обязательно проверь сеть перед отправкой."
      - title: "BTC"
        asset: "BTC"
        address: "bc1qxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
        note: "Сеть Bitcoin."

# ═══════════════════════════════════════════════════════════════════════════
#  5. ВОЗВРАТЫ
# ═══════════════════════════════════════════════════════════════════════════
refund:
  enabled: true
  window_hours: 72               # в течение скольки часов можно просить возврат
  policy: |
    <b>Условия возврата</b>

    • Заявка принимается в течение <b>$window ч</b> после оплаты.
    • Возврат делается на криптокошелёк, с которого пришла оплата.
    • Решение принимает оператор — обычно в течение 24 часов.
    • Комиссия сети удерживается из суммы возврата.

# ═══════════════════════════════════════════════════════════════════════════
#  6. НАЗВАНИЯ СТАТУСОВ
# ═══════════════════════════════════════════════════════════════════════════
statuses:
  new:               "🕐 Ожидает оплаты"
  awaiting_check:    "🔍 На проверке оператором"
  paid:              "✅ Оплата подтверждена"
  activation:        "🛴 Ожидает данные от клиента"
  done:              "🎉 Выполнен"
  rejected:          "❌ Отклонён"
  cancelled:         "🚫 Отменён"
  expired:           "⌛️ Просрочен"
  refund_requested:  "↩️ Запрошен возврат"
  refund_approved:   "💸 Возврат одобрен"
  refunded:          "💰 Средства возвращены"

# ═══════════════════════════════════════════════════════════════════════════
#  7. ВСЕ ТЕКСТЫ БОТА
# ═══════════════════════════════════════════════════════════════════════════
texts:
  start: |
    $e_star <b>$brand</b>

    Привет, $name! Здесь можно оформить:

    $e_scooter  <b>Самокаты Яндекс Go</b> — 3 / 7 / 30 дней
    $e_bag  <b>Товары с Яндекса</b> — выкуп по Сплиту
    $e_crypto  Оплата криптой, каждый заказ проверяет оператор

    Выбирай раздел ниже $e_fire

  menu: |
    $e_home <b>Главное меню</b>

    Выбери, что нужно:

  about: |
    $e_info <b>О сервисе $brand</b>

    • Работаем с 2024 года
    • Каждый заказ проходит ручную проверку оператором
    • Оплата криптовалютой: USDT (TRC-20 / TON), BTC
    • Возврат средств — через поддержку $support

    Отзывы: $reviews
    Канал: $channel

    <i>Сервис не является официальным сервисом Яндекса и не аффилирован с ним.</i>

  scooters_intro: |
    $e_scooter <b>Самокаты Яндекс Go</b>

    Выбери срок подписки. После оплаты оператор проверит платёж
    и откроет активацию — это занимает до 15 минут.

  scooter_card: |
    $e_scooter <b>$title</b>  <code>$badge</code>

    $description
    ━━━━━━━━━━━━━━━━━━━━
    $e_pay Стоимость: <b>$price</b>
    $e_clock Срок: <b>$duration дней</b>
    $e_box В наличии: <b>$stock</b>

  goods_intro: |
    $e_bag <b>Товары с Яндекса</b>

    Готовые позиции ниже. Если нужного товара нет —
    воспользуйся разделом «Выкуп по Сплиту» и пришли ссылку.

  catalog_empty: |
    $e_info Раздел пока пуст.

    Загляни в «$e_split Выкуп по Сплиту» — оформим любой товар по ссылке.

  goods_empty: |
    $e_bag Готовых позиций сейчас нет.

    Пришли ссылку на любой товар через «$e_split Выкуп по Сплиту» —
    посчитаем стоимость под твой заказ.

  goods_card: |
    $e_bag <b>$title</b>

    $description
    ━━━━━━━━━━━━━━━━━━━━
    $e_pay Стоимость: <b>$price</b>
    $e_box В наличии: <b>$stock</b>

  split_intro: |
    $e_split <b>Выкуп по Сплиту</b>

    Как это работает:
    <b>1.</b> Присылаешь ссылку на товар с Яндекс Маркета
    <b>2.</b> Бот подтягивает название и цену
    <b>3.</b> Платишь комиссию сервиса криптой
    <b>4.</b> Выбираешь ПВЗ или курьера — оператор оформляет выкуп

    <b>Комиссия сервиса</b>
    $tiers

    Лимит стоимости товара: до <b>$max</b>

  split_ask_link: |
    $e_link Пришли <b>ссылку на товар</b> одним сообщением.

    Пример: <code>https://market.yandex.ru/product--.../123456</code>

  split_bad_link: |
    $e_cross Это не похоже на ссылку с Яндекса.

    Разрешённые домены: <code>$domains</code>
    Попробуй ещё раз или вернись в меню.

  split_fetching: "$e_clock Смотрю товар по ссылке…"

  split_ask_price: |
    $e_info Не смог автоматически определить цену товара.

    Напиши <b>стоимость товара в рублях</b> цифрами — например <code>34990</code>

  split_bad_price: "$e_cross Нужно число в рублях. Например: <code>34990</code>"

  split_price_low: "$e_cross Минимальная стоимость товара — <b>$min</b>."

  split_price_high: |
    $e_cross Стоимость товара выше лимита <b>$max</b>.

    Напиши в поддержку $support — обсудим индивидуально.

  split_card: |
    $e_split <b>Выкуп по Сплиту</b>

    $e_bag <b>$title</b>
    $e_link <a href="$url">Ссылка на товар</a>
    ━━━━━━━━━━━━━━━━━━━━
    Стоимость товара: <b>$item_price</b>
    Комиссия сервиса: <b>$fee</b>
    ━━━━━━━━━━━━━━━━━━━━
    $e_pay <b>К оплате: $total</b>

    Всё верно?

  split_ask_delivery: "$e_truck Как доставить товар?"

  split_ask_address: "$e_pin $ask"

  split_address_short: "$e_cross Слишком короткий адрес — напиши подробнее."

  order_created: |
    $e_orders <b>Заказ #$order_id создан</b>

    $title
    $e_pay К оплате: <b>$amount</b>
    $e_clock Оплатить нужно в течение <b>$ttl мин</b>

    Выбери способ оплаты:

